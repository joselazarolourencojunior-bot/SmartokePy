<script>
    // 1. Trava de Nome Obrigatório
    document.addEventListener("DOMContentLoaded", function() {
        const singerInput = document.getElementById("singer") || document.querySelector("input[name='singer']");
        if (singerInput) {
            singerInput.setAttribute("required", "true");
            singerInput.placeholder = "DIGITE SEU NOME PARA ENVIAR *";
            singerInput.style.border = "2px solid #ff4444";
        }

        // 2. NOVA PERSONALIZAÇÃO: Nome do Sistema e Cores do Logotipo
        // Altera o título textual do menu superior para SmartokePy
        const brand = document.querySelector(".navbar-brand") || document.querySelector(".brand");
        if (brand) {
            brand.innerHTML = "🎤 SMARTOKE<span style='color:#3498db'>Py</span>";
        }

        // Altera o fundo do cabeçalho para Preto Puro condizente com a base do logo
        const navbar = document.querySelector(".navbar") || document.querySelector("nav");
        if (navbar) {
            navbar.style.backgroundColor = "#000000";
            navbar.style.borderBottom = "3px solid #ff4500"; // Detalhe laranja combinando com o topo do logo
        }
        
        // Altera o título da aba do navegador do celular
        document.title = "SmartokePy - Sistema de Karaokê";
    });
</script>
